[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voltio-mcp"
version = "0.1.0"
description = "MCP server that lets a coding agent control a BK Precision 1900B-series PSU via the voltio CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
voltio-mcp = "voltio_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["voltio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
